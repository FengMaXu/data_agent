name: CI

on:
  # Every PR, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [develop, master]

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The product is a Windows desktop app and some tests use Windows paths.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # No test starts Electron; skip the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # python-job tests run a real interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Architecture gate
        run: npm run verify:architecture

      - name: Script tests
        run: npm run test:scripts

      # Build once; the root typecheck/test scripts would each rebuild everything.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Negative type tests
        run: npm run typecheck:negative --workspace=@data-agent/runtime

      - name: Test
        run: npm run test --workspaces --if-present

      # The rest of verify:backend, before a release: the shipped bundles and a web host start-up.
      - name: Distribution build
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: npm run build:distribution

      - name: Web host smoke
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: node scripts/smoke-web-host.mjs

      # Charts in a real browser: SVG preview, dashboard in the app's preview sandbox, chat widget.
      - name: Chart browser smoke
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        run: node scripts/smoke-charts-browser.mjs

  postgres:
    # Statement time limits and cancellation need a real PostgreSQL server.
    # Service containers run on Linux runners only, so this job is separate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      DATA_AGENT_TEST_PG: "1"
      DATA_AGENT_PG_HOST: 127.0.0.1
      DATA_AGENT_PG_PORT: "5432"
      DATA_AGENT_PG_USER: postgres
      DATA_AGENT_PG_PASSWORD: postgres
      DATA_AGENT_PG_DATABASE: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The integration test starts the built PostgreSQL MCP server CLI.
      - name: Build
        run: npm run build --workspace=@data-agent/mcp-pg --workspace=@data-agent/database

      - name: PostgreSQL integration
        run: npx vitest run src/postgres.integration.test.ts
        working-directory: packages/database
