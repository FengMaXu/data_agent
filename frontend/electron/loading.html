<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Data Agent</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        color: #111827;
        font-family: "Josefin Sans", "Noto Serif SC", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 18%, rgba(240, 68, 56, 0.18), transparent 28%),
          radial-gradient(circle at 80% 16%, rgba(245, 158, 11, 0.16), transparent 26%),
          linear-gradient(135deg, #fff7ed, #f8fafc 52%, #ecfeff);
      }

      .panel {
        width: min(520px, calc(100vw - 48px));
        padding: 34px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 26px 80px rgba(31, 41, 55, 0.16);
        backdrop-filter: blur(18px);
      }

      .pulse {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: #f04438;
        box-shadow: 0 0 0 0 rgba(240, 68, 56, 0.34);
        animation: pulse 1.35s ease-out infinite;
      }

      h1 {
        margin: 28px 0 12px;
        font-size: 2.2rem;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #6b7280;
        line-height: 1.7;
      }

      @keyframes pulse {
        70% {
          box-shadow: 0 0 0 24px rgba(240, 68, 56, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(240, 68, 56, 0);
        }
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <div class="pulse"></div>
      <h1>Starting local engine</h1>
      <p>Data Agent is finding a private port, launching the Python service, and checking health before opening the workspace.</p>
    </section>
  </body>
</html>
